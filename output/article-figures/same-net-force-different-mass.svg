<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f5f7ff"/><g font-family="Arial, Helvetica, sans-serif"><rect x="48" y="42" width="62" height="8" rx="4" fill="#edba4d" stroke="#edba4d" stroke-width="2"/><text x="48" y="119" font-size="48" fill="#17264b" font-weight="700" text-anchor="start">Same force. Twice the mass.</text><text x="48" y="176" font-size="31" fill="#526482" font-weight="500" text-anchor="start">Compare acceleration while keeping net force fixed.</text><text x="85" y="245" font-size="25" fill="#526482" font-weight="700" text-anchor="start">MASS</text><text x="515" y="245" font-size="25" fill="#526482" font-weight="700" text-anchor="start">NET FORCE</text><text x="880" y="245" font-size="25" fill="#526482" font-weight="700" text-anchor="start">ACCELERATION</text><rect x="48" y="270" width="1104" height="215" rx="22" fill="#fff" stroke="#dce3f3" stroke-width="2"/><rect x="90" y="300" width="300" height="115" rx="14" fill="#edf1ff" stroke="#4263dc" stroke-width="2"/><circle cx="155" cy="428" r="24" fill="#17264b"/><circle cx="325" cy="428" r="24" fill="#17264b"/><text x="240" y="374" font-size="56" fill="#17264b" font-weight="700" text-anchor="middle">10 kg</text><line x1="510" y1="383" x2="730" y2="383" stroke="#4263dc" stroke-width="8" stroke-linecap="round"/><path d="M 710 369 L 730 383 L 710 397" fill="none" stroke="#4263dc" stroke-width="8" stroke-linejoin="round"/><text x="620" y="347" font-size="42" fill="#4263dc" font-weight="700" text-anchor="middle">20 N</text><text x="1010" y="385" font-size="54" fill="#17264b" font-weight="700" text-anchor="middle">2 m/s²</text><rect x="48" y="515" width="1104" height="215" rx="22" fill="#fff" stroke="#dce3f3" stroke-width="2"/><rect x="90" y="545" width="300" height="115" rx="14" fill="#edf1ff" stroke="#4263dc" stroke-width="2"/><circle cx="155" cy="673" r="24" fill="#17264b"/><circle cx="325" cy="673" r="24" fill="#17264b"/><text x="240" y="619" font-size="56" fill="#17264b" font-weight="700" text-anchor="middle">20 kg</text><line x1="510" y1="628" x2="730" y2="628" stroke="#4263dc" stroke-width="8" stroke-linecap="round"/><path d="M 710 614 L 730 628 L 710 642" fill="none" stroke="#4263dc" stroke-width="8" stroke-linejoin="round"/><text x="620" y="592" font-size="42" fill="#4263dc" font-weight="700" text-anchor="middle">20 N</text><text x="1010" y="630" font-size="54" fill="#17264b" font-weight="700" text-anchor="middle">1 m/s²</text><text x="600" y="807" font-size="39" fill="#17264b" font-weight="700" text-anchor="middle">Double the mass → half the acceleration</text><text x="1150" y="866" font-size="26" fill="#526482" font-weight="700" text-anchor="end">LearnerKits</text></g></svg>