<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f5f7ff"/><g font-family="Arial, Helvetica, sans-serif"><rect x="48" y="42" width="62" height="8" rx="4" fill="#edba4d" stroke="#edba4d" stroke-width="2"/><text x="48" y="119" font-size="48" fill="#17264b" font-weight="700" text-anchor="start">One situation. Three representations.</text><text x="48" y="176" font-size="31" fill="#526482" font-weight="500" text-anchor="start">Constant net force on a 5 kg cart, starting from rest.</text><rect x="48" y="215" width="520" height="280" rx="22" fill="#fff" stroke="#dce3f3" stroke-width="2"/><rect x="592" y="215" width="560" height="280" rx="22" fill="#fff" stroke="#dce3f3" stroke-width="2"/><text x="82" y="263" font-size="26" fill="#526482" font-weight="700" text-anchor="start">1  FORCE SKETCH</text><rect x="218" y="330" width="152" height="80" rx="10" fill="#edf1ff" stroke="#4263dc" stroke-width="2"/><text x="294" y="383" font-size="39" fill="#17264b" font-weight="700" text-anchor="middle">5 kg</text><line x1="225" y1="305" x2="465" y2="305" stroke="#4263dc" stroke-width="8" stroke-linecap="round"/><path d="M 445 291 L 465 305 L 445 319" fill="none" stroke="#4263dc" stroke-width="8" stroke-linejoin="round"/><text x="330" y="289" font-size="28" fill="#4263dc" font-weight="600" text-anchor="middle">20 N applied</text><line x1="285" y1="440" x2="225" y2="440" stroke="#b67619" stroke-width="8" stroke-linecap="round"/><path d="M 245 426 L 225 440 L 245 454" fill="none" stroke="#b67619" stroke-width="8" stroke-linejoin="round"/><text x="340" y="474" font-size="28" fill="#926010" font-weight="600" text-anchor="middle">5 N resistance</text><text x="630" y="263" font-size="26" fill="#526482" font-weight="700" text-anchor="start">2  CALCULATION</text><text x="630" y="338" font-size="35" fill="#17264b" font-weight="600" text-anchor="start">Net force = 20 − 5 = 15 N</text><text x="630" y="405" font-size="43" fill="#17264b" font-weight="700" text-anchor="start">a = 15 / 5 = 3 m/s²</text><rect x="48" y="519" width="1104" height="305" rx="22" fill="#fff" stroke="#dce3f3" stroke-width="2"/><text x="82" y="563" font-size="26" fill="#526482" font-weight="700" text-anchor="start">3  VELOCITY–TIME GRAPH</text><text x="80" y="604" font-size="27" fill="#526482" font-weight="500" text-anchor="start">v (m/s)</text><line x1="180" y1="758" x2="725" y2="758" stroke="#dce3f3" stroke-width="2" stroke-linecap="round"/><text x="150" y="767" font-size="25" fill="#526482" font-weight="500" text-anchor="end">0</text><line x1="180" y1="688" x2="725" y2="688" stroke="#dce3f3" stroke-width="2" stroke-linecap="round"/><text x="150" y="697" font-size="25" fill="#526482" font-weight="500" text-anchor="end">3</text><line x1="180" y1="618" x2="725" y2="618" stroke="#dce3f3" stroke-width="2" stroke-linecap="round"/><text x="150" y="627" font-size="25" fill="#526482" font-weight="500" text-anchor="end">6</text><line x1="180" y1="600" x2="180" y2="758" stroke="#17264b" stroke-width="3" stroke-linecap="round"/><line x1="180" y1="758" x2="745" y2="758" stroke="#17264b" stroke-width="3" stroke-linecap="round"/><line x1="180" y1="758" x2="720" y2="618" stroke="#4263dc" stroke-width="7" stroke-linecap="round"/><text x="180" y="792" font-size="25" fill="#526482" font-weight="500" text-anchor="middle">0</text><text x="450" y="792" font-size="25" fill="#526482" font-weight="500" text-anchor="middle">1</text><text x="720" y="792" font-size="25" fill="#526482" font-weight="500" text-anchor="middle">2</text><text x="765" y="792" font-size="27" fill="#526482" font-weight="500" text-anchor="start">t (s)</text><text x="825" y="651" font-size="29" fill="#17264b" font-weight="600" text-anchor="start">Starts at rest.</text><text x="825" y="706" font-size="29" fill="#526482" font-weight="500" text-anchor="start">After 2 s:</text><text x="825" y="753" font-size="37" fill="#17264b" font-weight="700" text-anchor="start">v = 6 m/s</text><text x="1150" y="866" font-size="26" fill="#526482" font-weight="700" text-anchor="end">LearnerKits</text></g></svg>