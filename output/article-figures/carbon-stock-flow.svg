<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f5f7ff"/><g font-family="Arial, Helvetica, sans-serif"><rect x="48" y="42" width="62" height="8" rx="4" fill="#edba4d"/><text x="48" y="119" font-size="46" fill="#17264b" font-weight="700" text-anchor="start">CO₂ is a stock. Emissions are a flow.</text><text x="48" y="172" font-size="27" fill="#526482" font-weight="500" text-anchor="start">Atmospheric CO₂ rises whenever inflow is bigger than outflow, even if inflow is falling.</text><rect x="48" y="210" width="530" height="640" rx="22" fill="#fff" stroke="#dce3f3" stroke-width="2"/><text x="313" y="262" font-size="30" fill="#17264b" font-weight="700" text-anchor="middle">Today’s default</text><rect x="118" y="300" width="150" height="34" rx="10" fill="#9aa8c8"/><rect x="238" y="300" width="30" height="80" rx="8" fill="#9aa8c8"/><rect x="235.9" y="380" width="34.2" height="180" fill="#4263dc" opacity=".75"/><text x="348" y="322" font-size="24" fill="#4263dc" font-weight="700" text-anchor="start">Emissions 38</text><text x="348" y="352" font-size="20" fill="#526482" font-weight="500" text-anchor="start">GtCO₂/yr in</text><path d="M 128 470 L 148 740 L 478 740 L 498 470" fill="none" stroke="#17264b" stroke-width="6" stroke-linejoin="round"/><path d="M 138.0 605.0 L 148 740 L 478 740 L 488.0 605.0 Z" fill="#4263dc" opacity=".22"/><text x="313" y="700" font-size="22" fill="#17264b" font-weight="700" text-anchor="middle">Atmosphere (ppm)</text><rect x="184" y="740" width="28" height="36" fill="#2f9e6e" opacity=".8"/><text x="198" y="806" font-size="22" fill="#2f9e6e" font-weight="700" text-anchor="middle">Land −9</text><rect x="414" y="740" width="28" height="36" fill="#2f9e6e" opacity=".8"/><text x="428" y="806" font-size="22" fill="#2f9e6e" font-weight="700" text-anchor="middle">Ocean −10</text><text x="313" y="840" font-size="26" fill="#d9534f" font-weight="700" text-anchor="middle">Net +19 GtCO₂/yr: level rises</text><rect x="622" y="210" width="530" height="640" rx="22" fill="#fff" stroke="#dce3f3" stroke-width="2"/><text x="887" y="262" font-size="30" fill="#17264b" font-weight="700" text-anchor="middle">Emissions halved</text><rect x="692" y="300" width="150" height="34" rx="10" fill="#9aa8c8"/><rect x="812" y="300" width="30" height="80" rx="8" fill="#9aa8c8"/><rect x="818.45" y="380" width="17.1" height="180" fill="#4263dc" opacity=".75"/><text x="922" y="322" font-size="24" fill="#4263dc" font-weight="700" text-anchor="start">Emissions 19</text><text x="922" y="352" font-size="20" fill="#526482" font-weight="500" text-anchor="start">GtCO₂/yr in</text><path d="M 702 470 L 722 740 L 1052 740 L 1072 470" fill="none" stroke="#17264b" stroke-width="6" stroke-linejoin="round"/><path d="M 712.0 605.0 L 722 740 L 1052 740 L 1062.0 605.0 Z" fill="#4263dc" opacity=".22"/><text x="887" y="700" font-size="22" fill="#17264b" font-weight="700" text-anchor="middle">Atmosphere (ppm)</text><rect x="758" y="740" width="28" height="36" fill="#2f9e6e" opacity=".8"/><text x="772" y="806" font-size="22" fill="#2f9e6e" font-weight="700" text-anchor="middle">Land −9</text><rect x="988" y="740" width="28" height="36" fill="#2f9e6e" opacity=".8"/><text x="1002" y="806" font-size="22" fill="#2f9e6e" font-weight="700" text-anchor="middle">Ocean −10</text><text x="887" y="840" font-size="26" fill="#2f9e6e" font-weight="700" text-anchor="middle">Net ≈ 0 at the start: level steady</text><line x1="440" y1="660" x2="440" y2="560" stroke="#d9534f" stroke-width="8" stroke-linecap="round"/><path d="M 424 578 L 440 556 L 456 578" fill="none" stroke="#d9534f" stroke-width="8" stroke-linejoin="round"/><line x1="990" y1="600" x2="1040" y2="600" stroke="#2f9e6e" stroke-width="8" stroke-linecap="round"/><line x1="990" y1="620" x2="1040" y2="620" stroke="#2f9e6e" stroke-width="8" stroke-linecap="round"/></g></svg>