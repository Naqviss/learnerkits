<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f5f7ff"/><g font-family="Arial, Helvetica, sans-serif"><rect x="48" y="42" width="62" height="8" rx="4" fill="#edba4d" stroke="#edba4d" stroke-width="2"/><text x="48" y="119" font-size="48" fill="#17264b" font-weight="700" text-anchor="start">Keep the settings with the result.</text><text x="48" y="176" font-size="31" fill="#526482" font-weight="500" text-anchor="start">A useful record explains what changed and what stayed fixed.</text><rect x="48" y="213" width="1104" height="132" rx="22" fill="#fff" stroke="#dce3f3" stroke-width="2"/><text x="82" y="255" font-size="25" fill="#526482" font-weight="700" text-anchor="start">QUESTION</text><text x="82" y="313" font-size="42" fill="#17264b" font-weight="600" text-anchor="start">How does volume affect gas pressure?</text><rect x="48" y="365" width="1104" height="104" rx="22" fill="#e8edff" stroke="#e8edff" stroke-width="2"/><text x="82" y="406" font-size="25" fill="#526482" font-weight="700" text-anchor="start">KEEP FIXED</text><text x="82" y="448" font-size="35" fill="#17264b" font-weight="600" text-anchor="start">Gas amount: 1 mol    ·    Temperature: 300 K</text><text x="82" y="523" font-size="25" fill="#526482" font-weight="700" text-anchor="start">PREDICTION</text><text x="82" y="568" font-size="38" fill="#17264b" font-weight="600" text-anchor="start">Halving volume should double pressure.</text><rect x="48" y="600" width="1104" height="207" rx="22" fill="#fff" stroke="#dce3f3" stroke-width="2"/><text x="82" y="640" font-size="25" fill="#526482" font-weight="700" text-anchor="start">CALCULATED EXAMPLE</text><text x="82" y="690" font-size="24" fill="#526482" font-weight="700" text-anchor="start">RUN</text><text x="360" y="690" font-size="24" fill="#526482" font-weight="700" text-anchor="start">VOLUME</text><text x="740" y="690" font-size="24" fill="#526482" font-weight="700" text-anchor="start">PRESSURE</text><text x="82" y="735" font-size="34" fill="#17264b" font-weight="600" text-anchor="start">A</text><text x="360" y="735" font-size="34" fill="#17264b" font-weight="500" text-anchor="start">20 L</text><text x="740" y="735" font-size="34" fill="#17264b" font-weight="500" text-anchor="start">124.7 kPa</text><text x="82" y="783" font-size="34" fill="#17264b" font-weight="600" text-anchor="start">B</text><text x="360" y="783" font-size="34" fill="#17264b" font-weight="500" text-anchor="start">10 L</text><text x="740" y="783" font-size="34" fill="#17264b" font-weight="500" text-anchor="start">249.4 kPa</text><text x="1150" y="866" font-size="26" fill="#526482" font-weight="700" text-anchor="end">LearnerKits</text></g></svg>