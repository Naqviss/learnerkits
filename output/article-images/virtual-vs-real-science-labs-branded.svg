<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
    <rect width="1200" height="800" fill="#eef2ff"/>
    <g transform="translate(36 10) scale(.94)">
<title>Compare a model circuit with a physical circuit</title>
<rect width="600" height="800" fill="#eef2ff"/><rect x="600" width="600" height="800" fill="#f8f1e7"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17264b">
<text x="300" y="110" font-size="30" font-weight="700" text-anchor="middle">Predict with a model</text>
<text x="900" y="110" font-size="30" font-weight="700" text-anchor="middle">Measure a real circuit</text>
<rect x="70" y="200" width="450" height="310" rx="22" fill="#17264b"/><rect x="90" y="220" width="410" height="270" rx="10" fill="#fff"/>
<path d="M40 510 H550 L520 546 H70Z" fill="#9aa8c8"/>
<path d="M165 330 V285 H420 V445 H165 V375" fill="none" stroke="#4263dc" stroke-width="5"/>
<path d="M144 343 H186 M153 365 H177" stroke="#17264b" stroke-width="6"/>
<text x="120" y="400" font-size="22">3 V</text>
<rect x="240" y="269" width="100" height="32" rx="4" fill="#edf1ff" stroke="#17264b" stroke-width="4"/>
<text x="290" y="255" font-size="21" text-anchor="middle">100 Ω</text>
<circle cx="420" cy="365" r="32" fill="#fff" stroke="#17264b" stroke-width="4"/>
<text x="420" y="376" font-size="30" font-weight="700" text-anchor="middle">A</text>
<text x="300" y="610" font-size="32" font-weight="700" text-anchor="middle">I = 3 ÷ 100 = 0.030 A</text>
<text x="300" y="652" font-size="22" fill="#526482" text-anchor="middle">Ideal wires and power source</text>
<rect x="657" y="535" width="490" height="20" rx="6" fill="#b98b5e"/>
<!-- Both leads form a single series loop through the resistor and ammeter. -->
<path d="M754 485 V320 H825 M959 320 H1060 V400" stroke="#dc6558" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M710 485 V525 H1026 V500" stroke="#263657" stroke-width="7" fill="none" stroke-linecap="round"/>
<rect x="680" y="460" width="112" height="52" rx="8" fill="#273956"/><rect x="730" y="460" width="62" height="52" rx="8" fill="#eeba4e"/>
<text x="700" y="451" font-size="23">−</text><text x="749" y="451" font-size="23">+</text>
<text x="761" y="496" font-size="20" font-weight="700" text-anchor="middle">3 V</text>
<path d="M815 320 H840 M950 320 H970" stroke="#7c889c" stroke-width="5"/>
<rect x="840" y="300" width="110" height="40" rx="15" fill="#c9dfe6" stroke="#617687" stroke-width="2"/>
<path d="M856 301 V339 M909 301 V339" stroke="#865b3e" stroke-width="8"/><path d="M882 301 V339" stroke="#263657" stroke-width="8"/><path d="M933 301 V339" stroke="#dbbc51" stroke-width="8"/>
<text x="894" y="278" font-size="23" text-anchor="middle">100 Ω resistor</text>
<rect x="986" y="387" width="142" height="120" rx="16" fill="#f2c14e" stroke="#17264b" stroke-width="4"/>
<rect x="999" y="402" width="116" height="41" rx="5" fill="#e2eddb"/>
<text x="1057" y="431" font-size="23" font-weight="700" text-anchor="middle">0.029 A</text>
<circle cx="1057" cy="471" r="16" fill="#fff" stroke="#17264b" stroke-width="3"/>
<text x="900" y="610" font-size="32" font-weight="700" text-anchor="middle">Read, repeat, compare</text>
<text x="900" y="652" font-size="22" fill="#526482" text-anchor="middle">Example reading, not measured data</text>
<circle cx="600" cy="380" r="42" fill="#fff" stroke="#c2cce0" stroke-width="2"/>
<path d="M577 371 H622 L612 361 M622 389 H578 L588 399" fill="none" stroke="#4263dc" stroke-width="4" stroke-linecap="round"/>
</g></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <path d="M36 766 H1164" stroke="#d6deef"/>
      <text x="38" y="791" font-size="16" fill="#536483">Predict. Experiment. Explain.</text>
      <text x="1162" y="791" text-anchor="end" font-size="21" font-weight="700" fill="#263b78">LearnerKits</text>
    </g>
  </svg>